name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --quiet -r requirements.txt ruff

      - name: Lint (syntax errors + pyflakes)
        run: ruff check --select E9,F kitebar/ main.py setup.py

      - name: Import smoke test
        run: |
          python3 - <<'EOF'
          import kitebar
          import kitebar.ui.app  # pulls in rumps/PyObjC/kiteconnect
          print("KiteBar", kitebar.__version__, "imports OK")
          EOF
